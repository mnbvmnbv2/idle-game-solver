<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Idle Solver Fast Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(17, 23, 38, 0.9);
      --text: #edf2ff;
      --muted: #9aa9c7;
      --line: rgba(255,255,255,0.09);
      --accent: #7aa2ff;
      --frontier: #9d7aff;
      --best: #77f2a1;
      --current: #ffffff;
      --node: #3f8cff;
      --pruned: #ff6b8a;
      --warn: #ffd166;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius: 18px;
      --shadow: 0 16px 60px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(122,162,255,0.18), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(157,122,255,0.13), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    #app {
      display: grid;
      grid-template-columns: 330px 1fr 360px;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      height: 100%;
      padding: 14px;
    }

    header {
      grid-column: 1 / 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: 18px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
      min-height: 0;
    }

    #left {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
    }

    #center {
      grid-column: 2;
      grid-row: 2;
      position: relative;
    }

    #right {
      grid-column: 3;
      grid-row: 2;
      display: flex;
      flex-direction: column;
    }

    #bottom {
      grid-column: 1 / 4;
      grid-row: 3;
      padding: 12px 16px;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas:active {
      cursor: grabbing;
    }

    .panel-title {
      padding: 14px 16px 10px;
      font-weight: 750;
      border-bottom: 1px solid var(--line);
    }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      padding: 11px;
      background: rgba(255,255,255,0.045);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      color: var(--text);
      padding: 9px 11px;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover {
      border-color: rgba(122,162,255,0.6);
    }

    button.active {
      border-color: rgba(119,242,161,0.8);
      box-shadow: 0 0 0 3px rgba(119,242,161,0.12);
    }

    input[type="file"] {
      color: var(--muted);
      font-size: 13px;
      max-width: 240px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .timeline-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto auto;
      gap: 12px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      display: inline-block;
    }

    #node-details {
      overflow: auto;
      flex: 1;
      padding: 14px 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    td {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      vertical-align: top;
    }

    td:first-child {
      color: var(--muted);
      width: 40%;
    }

    td:last-child {
      font-family: var(--mono);
      overflow-wrap: anywhere;
    }

    .path-list {
      max-height: 260px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .path-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
    }

    .path-item:hover {
      color: var(--text);
    }

    .search-box {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 10px 11px;
      border-radius: 12px;
      outline: none;
      font-family: var(--mono);
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .warn {
      color: var(--warn);
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -115%);
      background: rgba(5,8,14,0.94);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      z-index: 20;
    }

    @media (max-width: 1150px) {
      body {
        overflow: auto;
      }

      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 260px 700px 340px auto;
        overflow: auto;
      }

      header, #left, #center, #right, #bottom {
        grid-column: 1;
      }

      #left { grid-row: 2; }
      #center { grid-row: 3; }
      #right { grid-row: 4; }
      #bottom { grid-row: 5; }
    }
  </style>
</head>

<body>
<div id="app">
  <header>
    <div>
      <h1>Idle Solver Fast Visualizer</h1>
      <div class="subtitle">Canvas renderer, time/depth X, tree/income Y, timeline replay, best path, and node inspector.</div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
      <input id="fileInput" type="file" accept="application/json,.json" />
      <button id="loadDefaultBtn">Load trace.json</button>
    </div>
  </header>

  <aside id="left" class="panel">
    <div class="panel-title">Run summary</div>

    <div class="section">
      <div class="stats-grid" id="stats"></div>
    </div>

    <div class="section">
      <div class="panel-title" style="padding:0 0 10px;border:0;">Legend</div>
      <div class="legend-row"><span class="dot" style="background:var(--node)"></span> Accepted node</div>
      <div class="legend-row"><span class="dot" style="background:var(--frontier)"></span> Frontier-ish</div>
      <div class="legend-row"><span class="dot" style="background:var(--current)"></span> Current pop</div>
      <div class="legend-row"><span class="dot" style="background:var(--best)"></span> Best path</div>
      <div class="legend-row"><span class="dot" style="background:var(--pruned)"></span> Pruned</div>
    </div>

    <div class="section">
      <div class="panel-title" style="padding:0 0 10px;border:0;">Best path</div>
      <div class="path-list" id="bestPath"></div>
    </div>
  </aside>

  <main id="center" class="panel">
    <canvas id="canvas"></canvas>
    <div id="tooltip"></div>
  </main>

  <aside id="right" class="panel">
    <div class="panel-title">Node inspector</div>

    <div class="section">
      <input id="searchBox" class="search-box" placeholder="Jump to node id or inventory, e.g. 1234 or [10,5,2]" />
    </div>

    <div id="node-details">
      <div class="small">Load a trace and click a node.</div>
    </div>
  </aside>

  <footer id="bottom" class="panel">
    <div class="timeline-row">
      <button id="playBtn">Play</button>
      <input id="timeline" type="range" min="0" max="0" value="0" />
      <span class="pill" id="iterPill">iter 0</span>
      <span class="pill" id="eventPill">event 0 / 0</span>
      <span class="pill" id="layoutPill">x time · y tree</span>

      <div class="controls">
        <button id="fitBtn">Fit</button>
        <button id="layoutBtn" class="active">Time X</button>
        <button id="yLayoutBtn">Tree Y</button>
        <button id="bestBtn">Best path</button>
      </div>
    </div>
  </footer>
</div>

<script>
let trace = null;
let nodesById = new Map();
let childrenById = new Map();

let eventIndex = 0;
let selectedNodeId = null;
let playTimer = null;

let layoutMode = "time";
let yMode = "tree";

let transform = d3.zoomIdentity;

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d", { alpha: true });
const tooltip = document.querySelector("#tooltip");

let state = {
  iter: 0,
  currentNode: null,
  frontier: new Uint8Array(0),
  pruned: new Uint8Array(0),
  accepted: new Uint8Array(0),
  best: new Uint8Array(0),
};

const css = getComputedStyle(document.documentElement);

const colors = {
  node: css.getPropertyValue("--node").trim(),
  frontier: css.getPropertyValue("--frontier").trim(),
  current: css.getPropertyValue("--current").trim(),
  best: css.getPropertyValue("--best").trim(),
  pruned: css.getPropertyValue("--pruned").trim(),
  link: "rgba(255,255,255,0.11)",
  linkBest: css.getPropertyValue("--best").trim(),
  faint: "rgba(255,255,255,0.06)",
  selected: "#ffffff",
  axis: "rgba(255,255,255,0.16)",
  axisText: "rgba(237,242,255,0.62)",
};

const fmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const fmtInt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });

function formatNum(x) {
  if (x === null || x === undefined) return "";
  if (Math.abs(x) >= 1e6) return Number(x).toExponential(3);
  return fmt.format(x);
}

function formatInt(x) {
  if (x === null || x === undefined) return "";
  return fmtInt.format(x);
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener("resize", resizeCanvas);

const zoom = d3.zoom()
  .scaleExtent([0.03, 20])
  .on("zoom", event => {
    transform = event.transform;
    draw();
  });

d3.select(canvas).call(zoom);

function resetTimelineState() {
  const n = trace.nodes.length;

  state = {
    iter: 0,
    currentNode: null,
    frontier: new Uint8Array(n),
    pruned: new Uint8Array(n),
    accepted: new Uint8Array(n),
    best: new Uint8Array(n),
  };

  for (const id of trace.best_path_node_ids || []) {
    if (id < n) state.best[id] = 1;
  }
}

function replayTo(index) {
  resetTimelineState();

  const max = Math.min(index, trace.events.length - 1);

  for (let i = 0; i <= max; i++) {
    applyEvent(trace.events[i]);
  }

  eventIndex = max;
}

function applyEvent(e) {
  if (!e) return;

  state.iter = Math.max(state.iter, e.iter || 0);

  if (e.type === "Start") {
    if (e.node < state.accepted.length) {
      state.accepted[e.node] = 1;
      state.frontier[e.node] = 1;
    }
    state.currentNode = e.node;
  }

  if (e.type === "Accept") {
    if (e.node < state.accepted.length) {
      state.accepted[e.node] = 1;
      state.frontier[e.node] = 1;
    }
  }

  if (e.type === "Pop") {
    state.currentNode = e.node;
    if (e.node < state.frontier.length) state.frontier[e.node] = 0;
  }

  if (e.type === "Prune") {
    if (e.node < state.pruned.length) {
      state.pruned[e.node] = 1;
      state.frontier[e.node] = 0;
    }
  }
}

function setEventIndex(next) {
  next = Math.max(0, Math.min(next, trace.events.length - 1));

  if (next >= eventIndex && next - eventIndex < 2000) {
    for (let i = eventIndex + 1; i <= next; i++) {
      applyEvent(trace.events[i]);
    }
    eventIndex = next;
  } else {
    replayTo(next);
  }

  document.querySelector("#timeline").value = eventIndex;
  document.querySelector("#iterPill").textContent = `iter ${formatInt(state.iter)}`;
  document.querySelector("#eventPill").textContent = `event ${formatInt(eventIndex + 1)} / ${formatInt(trace.events.length)}`;

  draw();
}

function buildIndexes() {
  nodesById = new Map(trace.nodes.map(n => [n.id, n]));
  childrenById = new Map();

  for (const n of trace.nodes) {
    if (n.parent !== null && n.parent !== undefined) {
      if (!childrenById.has(n.parent)) childrenById.set(n.parent, []);
      childrenById.get(n.parent).push(n.id);
    }
  }
}

function computeLayout() {
  if (!trace || !trace.nodes.length) return;

  const maxDepth = d3.max(trace.nodes, d => d.depth) || 1;
  const maxTime = d3.max(trace.nodes, d => d.time) || 1;
  const maxIncome = d3.max(trace.nodes, d => d.income) || 1;
  const minIncome = d3.min(trace.nodes, d => d.income) || 0;

  const depthWidth = 170;
  const timeWidth = Math.max(1400, maxDepth * depthWidth);

  const incomeHeight = Math.max(900, maxDepth * 95);

  const depthBuckets = new Map();

  for (const n of trace.nodes) {
    if (!depthBuckets.has(n.depth)) depthBuckets.set(n.depth, []);
    depthBuckets.get(n.depth).push(n);
  }

  for (const [depth, bucket] of depthBuckets.entries()) {
    bucket.sort((a, b) => a.iter_created - b.iter_created);

    const gap = 24;
    const totalHeight = Math.max(900, bucket.length * gap);

    for (let i = 0; i < bucket.length; i++) {
      const n = bucket[i];

      n.xDepth = depth * depthWidth;

      // Sqrt time scale keeps early game readable.
      // For true linear time, use: n.xTime = (n.time / maxTime) * timeWidth;
      n.xTime = Math.sqrt(n.time / maxTime) * timeWidth;

      n.yTree = i * gap - totalHeight / 2;

      // Higher income appears higher on screen.
      // log1p keeps large income gaps readable.
      const incomeNorm =
        Math.log1p(n.income - minIncome) /
        Math.max(1e-9, Math.log1p(maxIncome - minIncome));

      n.yIncome = -incomeNorm * incomeHeight;
    }
  }

  trace.layoutStats = {
    maxDepth,
    maxTime,
    maxIncome,
    minIncome,
    timeWidth,
    incomeHeight,
  };

  applyLayoutMode();
}

function applyLayoutMode() {
  for (const n of trace.nodes) {
    n.x = layoutMode === "time" ? n.xTime : n.xDepth;
    n.y = yMode === "income" ? n.yIncome : n.yTree;
  }

  document.querySelector("#layoutPill").textContent =
    `${layoutMode === "time" ? "x time" : "x depth"} · ${yMode === "income" ? "y income" : "y tree"}`;

  document.querySelector("#layoutBtn").textContent =
    layoutMode === "time" ? "Time X" : "Depth X";

  document.querySelector("#yLayoutBtn").textContent =
    yMode === "income" ? "Income Y" : "Tree Y";

  document.querySelector("#layoutBtn").classList.toggle("active", layoutMode === "time");
  document.querySelector("#yLayoutBtn").classList.toggle("active", yMode === "income");

  draw();
}

function nodeRadius(n) {
  return 2.4 + Math.min(4.2, Math.log10(Math.max(1, n.income)) * 0.7);
}

function nodeColor(n) {
  if (selectedNodeId === n.id) return colors.selected;
  if (state.best[n.id]) return colors.best;
  if (state.currentNode === n.id) return colors.current;
  if (state.pruned[n.id]) return colors.pruned;
  if (state.frontier[n.id]) return colors.frontier;
  if (state.accepted[n.id]) return colors.node;
  return colors.faint;
}

function isVisibleWorld(x, y, pad = 80) {
  const rect = canvas.getBoundingClientRect();

  const sx = transform.applyX(x);
  const sy = transform.applyY(y);

  return sx >= -pad && sx <= rect.width + pad && sy >= -pad && sy <= rect.height + pad;
}

function drawAxes() {
  if (!trace || !trace.layoutStats) return;
  if (layoutMode !== "time" && yMode !== "income") return;

  const rect = canvas.getBoundingClientRect();

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = colors.axisText;
  ctx.strokeStyle = colors.axis;
  ctx.lineWidth = 1;
  ctx.font = "12px " + getComputedStyle(document.body).fontFamily;

  if (layoutMode === "time") {
    ctx.fillText("x: game time, sqrt scaled", 18, rect.height - 18);
  } else {
    ctx.fillText("x: purchase depth", 18, rect.height - 18);
  }

  if (yMode === "income") {
    ctx.fillText("y: income, log scaled", 18, rect.height - 36);
  } else {
    ctx.fillText("y: tree bucket layout", 18, rect.height - 36);
  }

  ctx.restore();
}

function draw() {
  if (!trace) return;

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  const visibleLineWidth = 1 / transform.k;

  // Normal links.
  ctx.lineWidth = Math.max(0.4, visibleLineWidth);
  ctx.strokeStyle = colors.link;
  ctx.beginPath();

  for (const n of trace.nodes) {
    if (!state.accepted[n.id]) continue;
    if (n.parent === null || n.parent === undefined) continue;

    const p = nodesById.get(n.parent);
    if (!p || !state.accepted[p.id]) continue;

    if (!isVisibleWorld(n.x, n.y) && !isVisibleWorld(p.x, p.y)) continue;
    if (state.best[n.id] && state.best[p.id]) continue;

    ctx.moveTo(p.x, p.y);
    ctx.lineTo(n.x, n.y);
  }

  ctx.stroke();

  // Best path links.
  ctx.lineWidth = Math.max(1.6, 2.4 / transform.k);
  ctx.strokeStyle = colors.linkBest;
  ctx.beginPath();

  const path = trace.best_path_node_ids || [];
  for (let i = 1; i < path.length; i++) {
    const a = nodesById.get(path[i - 1]);
    const b = nodesById.get(path[i]);

    if (!a || !b) continue;
    if (!state.accepted[a.id] || !state.accepted[b.id]) continue;
    if (!isVisibleWorld(a.x, a.y) && !isVisibleWorld(b.x, b.y)) continue;

    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }

  ctx.stroke();

  // Nodes.
  for (const n of trace.nodes) {
    if (!state.accepted[n.id]) continue;
    if (!isVisibleWorld(n.x, n.y, 40)) continue;

    const r = selectedNodeId === n.id
      ? nodeRadius(n) + 3 / transform.k
      : nodeRadius(n);

    ctx.beginPath();
    ctx.fillStyle = nodeColor(n);
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();

    if (selectedNodeId === n.id) {
      ctx.lineWidth = Math.max(1.2, 2 / transform.k);
      ctx.strokeStyle = colors.selected;
      ctx.stroke();
    }
  }

  ctx.restore();

  drawAxes();
}

function fitView() {
  if (!trace || !trace.nodes.length) return;

  const visibleNodes = trace.nodes.filter(n => state.accepted[n.id]);
  const nodes = visibleNodes.length ? visibleNodes : trace.nodes;

  const minX = d3.min(nodes, d => d.x);
  const maxX = d3.max(nodes, d => d.x);
  const minY = d3.min(nodes, d => d.y);
  const maxY = d3.max(nodes, d => d.y);

  const rect = canvas.getBoundingClientRect();
  const pad = 90;

  const w = Math.max(1, maxX - minX + pad * 2);
  const h = Math.max(1, maxY - minY + pad * 2);

  const k = Math.min(rect.width / w, rect.height / h, 1.3);
  const x = rect.width / 2 - ((minX + maxX) / 2) * k;
  const y = rect.height / 2 - ((minY + maxY) / 2) * k;

  const t = d3.zoomIdentity.translate(x, y).scale(k);

  d3.select(canvas)
    .transition()
    .duration(450)
    .call(zoom.transform, t);
}

function centerNode(id) {
  const n = nodesById.get(id);
  if (!n) return;

  const rect = canvas.getBoundingClientRect();
  const k = Math.max(transform.k, 1.8);

  const t = d3.zoomIdentity
    .translate(rect.width / 2 - n.x * k, rect.height / 2 - n.y * k)
    .scale(k);

  d3.select(canvas)
    .transition()
    .duration(350)
    .call(zoom.transform, t);
}

function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();

  const sx = clientX - rect.left;
  const sy = clientY - rect.top;

  return {
    x: transform.invertX(sx),
    y: transform.invertY(sy),
  };
}

function pickNode(clientX, clientY) {
  const p = screenToWorld(clientX, clientY);

  let best = null;
  let bestDist = Infinity;

  const threshold = 12 / transform.k;

  for (const n of trace.nodes) {
    if (!state.accepted[n.id]) continue;
    if (!isVisibleWorld(n.x, n.y, 40)) continue;

    const dx = n.x - p.x;
    const dy = n.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < threshold && dist < bestDist) {
      best = n;
      bestDist = dist;
    }
  }

  return best;
}

canvas.addEventListener("click", event => {
  if (!trace) return;

  const n = pickNode(event.clientX, event.clientY);

  if (n) {
    selectNode(n.id);
  } else {
    selectedNodeId = null;
    draw();
  }
});

canvas.addEventListener("mousemove", event => {
  if (!trace) return;

  const n = pickNode(event.clientX, event.clientY);

  if (!n) {
    tooltip.style.opacity = 0;
    return;
  }

  tooltip.style.opacity = 1;
  tooltip.style.left = `${event.clientX}px`;
  tooltip.style.top = `${event.clientY}px`;
  tooltip.innerHTML = `
    node ${n.id}<br/>
    t=${formatInt(n.time)} finish=${formatInt(n.finish_time)}<br/>
    income=${formatNum(n.income)} inv=${JSON.stringify(n.inventory)}
  `;
});

canvas.addEventListener("mouseleave", () => {
  tooltip.style.opacity = 0;
});

function renderStats() {
  const m = trace.meta;

  const stats = [
    ["Goal", formatNum(m.goal)],
    ["Best time", formatInt(m.best_time)],
    ["Iterations", formatInt(m.iterations)],
    ["Final money", formatNum(m.final_money)],
    ["Final inv", JSON.stringify(m.final_inventory)],
    ["Trace nodes", formatInt(trace.nodes.length)],
    ["Events", formatInt(trace.events.length)],
    ["Truncated", `${m.truncated_nodes || m.truncated_events}`],
  ];

  document.querySelector("#stats").innerHTML = stats.map(([label, value]) => `
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>
  `).join("");

  if (m.truncated_nodes || m.truncated_events) {
    document.querySelector("#stats").innerHTML += `
      <div class="stat" style="grid-column:1/3;">
        <div class="stat-label warn">Trace warning</div>
        <div class="stat-value warn">Trace was truncated. Increase trace caps for more detail.</div>
      </div>
    `;
  }
}

function renderBestPath() {
  const path = trace.best_path_node_ids || [];

  document.querySelector("#bestPath").innerHTML = path.map((id, idx) => {
    const n = nodesById.get(id);
    if (!n) return "";

    const action = n.bought_name ? `buy ${n.bought_name}` : "start";

    return `
      <div class="path-item" onclick="selectNode(${id}); centerNode(${id});">
        #${idx} · node ${id}<br/>
        ${action} · t=${formatInt(n.time)} · finish=${formatInt(n.finish_time)}<br/>
        inv=${JSON.stringify(n.inventory)}
      </div>
    `;
  }).join("");
}

function selectNode(id) {
  const n = nodesById.get(id);
  if (!n) return;

  selectedNodeId = id;

  const resourceRows = trace.resources.map((r, i) => {
    return `<tr><td>${r.name}</td><td>${n.inventory[i]}</td></tr>`;
  }).join("");

  document.querySelector("#node-details").innerHTML = `
    <table>
      <tr><td>Node id</td><td>${n.id}</td></tr>
      <tr><td>Parent</td><td>${n.parent ?? ""}</td></tr>
      <tr><td>Bought</td><td>${n.bought_name ?? "start"}</td></tr>
      <tr><td>Depth</td><td>${n.depth}</td></tr>
      <tr><td>Created iter</td><td>${formatInt(n.iter_created)}</td></tr>
      <tr><td>Time</td><td>${formatInt(n.time)}</td></tr>
      <tr><td>Money</td><td>${formatNum(n.money)}</td></tr>
      <tr><td>Income</td><td>${formatNum(n.income)}</td></tr>
      <tr><td>Finish time</td><td>${formatInt(n.finish_time)}</td></tr>
      <tr><td>Wait for buy</td><td>${n.wait === null || n.wait === undefined ? "" : formatInt(n.wait)}</td></tr>
      <tr><td>Cost paid</td><td>${n.cost_paid === null || n.cost_paid === undefined ? "" : formatNum(n.cost_paid)}</td></tr>
      <tr><td>Inventory</td><td>${JSON.stringify(n.inventory)}</td></tr>
    </table>

    <div style="height:14px"></div>

    <div class="panel-title" style="padding:0 0 10px;border:0;">Inventory</div>
    <table>${resourceRows}</table>
  `;

  draw();
}

function setupTimeline() {
  const timeline = document.querySelector("#timeline");

  timeline.max = Math.max(0, trace.events.length - 1);
  timeline.value = 0;

  timeline.oninput = () => {
    setEventIndex(Number(timeline.value));
  };

  replayTo(0);
}

function play() {
  if (!trace) return;

  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    document.querySelector("#playBtn").textContent = "Play";
    return;
  }

  document.querySelector("#playBtn").textContent = "Pause";

  playTimer = setInterval(() => {
    const step = Math.max(1, Math.floor(trace.events.length / 900));
    const next = eventIndex + step;

    if (next >= trace.events.length - 1) {
      setEventIndex(trace.events.length - 1);
      clearInterval(playTimer);
      playTimer = null;
      document.querySelector("#playBtn").textContent = "Play";
    } else {
      setEventIndex(next);
    }
  }, 24);
}

async function loadUrl(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load ${url}: ${res.status}`);
  const json = await res.json();
  loadTrace(json);
}

function loadTrace(json) {
  trace = json;

  buildIndexes();
  computeLayout();
  renderStats();
  renderBestPath();
  setupTimeline();

  const lastBest = trace.best_path_node_ids?.at(-1);
  selectedNodeId = lastBest ?? trace.nodes[0]?.id ?? null;

  resizeCanvas();

  if (selectedNodeId !== null) {
    selectNode(selectedNodeId);
  }

  setTimeout(fitView, 60);
}

document.querySelector("#loadDefaultBtn").addEventListener("click", async () => {
  try {
    await loadUrl("trace.json");
  } catch (e) {
    alert(e.message + "\n\nTip: run `python3 -m http.server 8080` in this folder.");
  }
});

document.querySelector("#fileInput").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  const text = await file.text();
  loadTrace(JSON.parse(text));
});

document.querySelector("#playBtn").addEventListener("click", play);
document.querySelector("#fitBtn").addEventListener("click", fitView);

document.querySelector("#layoutBtn").addEventListener("click", () => {
  layoutMode = layoutMode === "time" ? "depth" : "time";
  applyLayoutMode();
  fitView();
});

document.querySelector("#yLayoutBtn").addEventListener("click", () => {
  yMode = yMode === "tree" ? "income" : "tree";
  applyLayoutMode();
  fitView();
});

document.querySelector("#bestBtn").addEventListener("click", () => {
  const last = trace?.best_path_node_ids?.at(-1);

  if (last !== undefined) {
    selectNode(last);
    centerNode(last);
  }
});

document.querySelector("#searchBox").addEventListener("keydown", event => {
  if (event.key !== "Enter" || !trace) return;

  const raw = event.target.value.trim();
  if (!raw) return;

  let node = null;

  if (/^\d+$/.test(raw)) {
    node = nodesById.get(Number(raw));
  } else {
    try {
      const inv = JSON.parse(raw);
      node = trace.nodes.find(n => JSON.stringify(n.inventory) === JSON.stringify(inv));
    } catch {
      node = null;
    }
  }

  if (node) {
    selectNode(node.id);
    centerNode(node.id);
  } else {
    alert("No matching node found.");
  }
});

// Auto-load trace.json when served locally.
loadUrl("trace.json").catch(() => {});
</script>
</body>
</html>
